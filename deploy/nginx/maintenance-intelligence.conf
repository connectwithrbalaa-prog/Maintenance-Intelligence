# Maintenance Intelligence — Nginx reverse proxy config
# Place this file at: /etc/nginx/sites-available/maintenance-intelligence
# Then: ln -s /etc/nginx/sites-available/maintenance-intelligence /etc/nginx/sites-enabled/
#
# Replace YOUR_DOMAIN_HERE with your actual domain (e.g. maintenance.yourdomain.com)
# If using raw IP only, set server_name to _ and remove the ssl/certbot block.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    # Let's Encrypt challenge (certbot needs this before issuing cert)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS once cert is issued
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    # --- SSL (certbot will fill these in automatically) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    # --- CORS for the Lovable frontend at asset-wise-look.lovable.app ---
    set $cors_origin "";
    if ($http_origin ~* "^https://asset-wise-look\.lovable\.app$") {
        set $cors_origin $http_origin;
    }

    # --- Main app + API (FastAPI on 8001) ---
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;

        # CORS headers so Lovable frontend can call this API
        add_header Access-Control-Allow-Origin  "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Dev-User" always;
        add_header Access-Control-Max-Age       3600 always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # --- Grafana (available at /grafana/) ---
    location /grafana/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
