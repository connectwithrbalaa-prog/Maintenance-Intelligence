# Maintenance Intelligence — Nginx config for IP-only access (no domain/SSL)
# Use this if you don't have a domain yet.
# Place at: /etc/nginx/sites-available/maintenance-intelligence
#
# Access at: http://72.62.231.202

server {
    listen 80 default_server;
    server_name _;

    # --- CORS for the Lovable frontend ---
    set $cors_origin "";
    if ($http_origin ~* "^https://asset-wise-look\.lovable\.app$") {
        set $cors_origin $http_origin;
    }

    # --- Main app + API ---
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;

        add_header Access-Control-Allow-Origin  "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Dev-User" always;
        add_header Access-Control-Max-Age       3600 always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # --- Grafana ---
    location /grafana/ {
        proxy_pass         http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
