groups:
- name: maintenance-intel-slos
  rules:
  - alert: IngestionZeroRate
    expr: rate(events_ingested_total[10m]) == 0
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "No events ingested in the last 10 minutes"
      description: "Check Kafka and ingestion service."
  - alert: RCALatencyHigh
    expr: histogram_quantile(0.95, sum by (le) (rate(rca_duration_seconds_bucket[10m]))) > 30
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "RCA 95th percentile latency over 30s"
      description: "Investigate GenAI latency or backpressure."
  - alert: RCAErrorRateHigh
    expr: (rate(rca_failures_total[10m]) / clamp_min(rate(rca_runs_total[10m]), 1)) > 0.01
    for: 10m
    labels: { severity: critical }
    annotations:
      summary: "RCA error rate above 1%"
      description: "Persistent failures in RCA pipeline."
  - alert: KafkaLagHigh
    expr: sum(kafka_consume_lag) > 1000
    for: 10m
    labels: { severity: critical }
    annotations:
      summary: "Kafka consumer lag too high"
      description: "Lag above threshold for >10m."
- name: maintenance-intel-cmms
  rules:
  - alert: CMMSSnapshotUnavailable
    expr: cmms_handoff_metrics_up == 0
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "CMMS handoff metrics are unavailable"
      description: "The API metrics endpoint could not refresh CMMS handoff backlog and retry gauges from Postgres for more than 10 minutes."
  - alert: CMMSHandoffBacklogHigh
    expr: cmms_handoff_backlog_total >= 3
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "CMMS handoff backlog is elevated"
      description: "There are {{ $value }} proposals stuck in pending or failure CMMS handoff states for at least 15 minutes."
  - alert: CMMSBackendBacklogHigh
    expr: cmms_handoff_backend_backlog_total >= 2
    for: 15m
    labels: { severity: warning }
    annotations:
      summary: "CMMS backend backlog is elevated"
      description: "Backend {{ $labels.backend }} has {{ $value }} proposals stuck in pending or failure CMMS handoff states for at least 15 minutes."
  - alert: CMMSAdminRetryRequired
    expr: cmms_handoff_admin_retry_required_total > 0
    for: 10m
    labels: { severity: warning }
    annotations:
      summary: "CMMS approvals need admin retry review"
      description: "{{ $value }} proposals have exhausted automatic approval attempts and still need manual retry review."
  - alert: CMMSRetryLimitReached
    expr: cmms_handoff_limit_reached_total > 0
    for: 5m
    labels: { severity: critical }
    annotations:
      summary: "CMMS retry ceiling reached"
      description: "{{ $value }} proposals have already hit the configured CMMS retry ceiling and need intervention."