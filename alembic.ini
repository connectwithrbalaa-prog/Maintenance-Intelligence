[alembic]
# path to migration scripts
script_location = maintenance_intelligence/db/alembic

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the python-dateutil library that can be
# installed by adding `alembic[tz]` to the pip requirements
# string value is passed to dateutil.tz.gettz()
timezone = UTC

# max length of characters to apply to the
# "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment file as a
# script, rather than importing it
# (this is the default behavior for alembic < 1.9.0)
run_as_script = false

# revision environment configuration
revision_environment = false

# enable logging of the SQL generated by alembic
# when running migrations
# (this can be useful for debugging)
# logging of SQL can also be enabled/disabled on a per-migration basis
# by setting the `sql` parameter on the `alembic.command.upgrade` and
# `alembic.command.downgrade` functions
sqlalchemy.url = postgresql://user:pass@localhost/dbname

# set to 'true' to use colors to indicate
# current head revision
# (requires the colorama library)
# color = true

# if specified, this will override the `revision_environment`
# setting and run the given module as a script
# (this is the default behavior for alembic < 1.9.0)
# revision_environment_script =

# if specified, this will override the `revision_environment`
# setting and run the given module as a script
# (this is the default behavior for alembic < 1.9.0)
# revision_environment_script =

# template used to generate revision files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

