name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with: { python-version: "3.11" }
    - run: pip install --upgrade pip && pip install .[dev]
    - name: Collect changed Python files
      id: python-files
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          base_ref="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$base_ref" --depth=50
          git diff --name-only --diff-filter=ACMR "origin/$base_ref"...HEAD -- '*.py' > python_files.txt
        elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
          git diff --name-only --diff-filter=ACMR "${{ github.event.before }}"...HEAD -- '*.py' > python_files.txt
        else
          git ls-files '*.py' > python_files.txt
        fi

        sed -i '/^$/d' python_files.txt
        echo "count=$(wc -l < python_files.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
    - name: Ruff changed Python files
      if: steps.python-files.outputs.count != '0'
      run: xargs -a python_files.txt ruff check
    - name: Black changed Python files
      if: steps.python-files.outputs.count != '0'
      run: xargs -a python_files.txt black --check
    - run: pytest --ignore=tests/test_migration_smoke.py

  portal-browser-smoke:
    if: ${{ vars.RUN_PLAYWRIGHT == 'true' }}
    runs-on: ubuntu-latest
    env:
      MI_DEV_ALLOW_HEADERS: "true"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.11" }
    - uses: actions/setup-node@v4
      with: { node-version: "20" }
    - run: pip install --upgrade pip && pip install .[dev]
    - run: npm install
    - run: npx playwright install --with-deps chromium
    - run: npm run test:portal:e2e

  migration-smoke:
    if: ${{ vars.RUN_MIGRATION_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: maintenance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
        - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d maintenance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.11" }
    - run: pip install --upgrade pip && pip install .[dev,ops]
    - name: Wait for Postgres
      env:
        POSTGRES_HOST: localhost
        POSTGRES_PORT: "5432"
        POSTGRES_DB: maintenance
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      run: |
        python - <<'PY'
        import os
        import time
        import psycopg2

        deadline = time.time() + 60
        last_error = None
        while time.time() < deadline:
            try:
                conn = psycopg2.connect(
                    dbname=os.environ["POSTGRES_DB"],
                    user=os.environ["POSTGRES_USER"],
                    password=os.environ["POSTGRES_PASSWORD"],
                    host=os.environ["POSTGRES_HOST"],
                    port=os.environ["POSTGRES_PORT"],
                )
                conn.close()
                print("Postgres up")
                raise SystemExit(0)
            except Exception as exc:
                last_error = exc
                print(f"Waiting for Postgres: {exc}")
                time.sleep(2)
        raise SystemExit(f"Postgres did not become ready: {last_error}")
        PY
    - name: Run migration smoke
      env:
        RUN_MIGRATION_SMOKE: "true"
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maintenance
        POSTGRES_HOST: localhost
        POSTGRES_PORT: "5432"
        POSTGRES_DB: maintenance
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      run: pytest tests/test_migration_workorder_timestamps.py -q
